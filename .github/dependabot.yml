version: 2
updates:
  # npm — one grouped PR per month (patch + minor + major ride together)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - "Technical Debt"
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    cooldown:
      default-days: 7
    groups:
      npm-all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch", "minor", "major"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # github-actions — one grouped PR per month (SHA pins + version comments)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - "Technical Debt"
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    groups:
      actions-all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["patch", "minor", "major"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
