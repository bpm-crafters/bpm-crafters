name: build docs

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [ opened, reopened, synchronize ]
    paths:
      - 'docs/**'
      - '.vitepress/**'
      - 'public/**'
      - 'index.md'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: "package-lock.json"
      - run: npm install
      - run: npm run build
